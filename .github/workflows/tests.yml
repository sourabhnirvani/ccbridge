name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.13"]
        exclude:
          # The newest Ubuntu image has no Python 3.8 any more; 22.04 still does
          - os: ubuntu-latest
            python-version: "3.8"
        include:
          - os: ubuntu-22.04
            python-version: "3.8"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest (ccb.py itself needs nothing)
        run: python -m pip install pytest

      - name: Run tests
        # The tests start real hubs on free ports; they should never hang.
        timeout-minutes: 10
        run: python -m pytest -v
